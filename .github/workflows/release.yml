# A merge to main IS the release. The per-PR workflow is deliberately light;
# this one runs the suite and the whole-tree PII scan, then tags v<VERSION>
# and cuts a GitHub release. An untouched VERSION means the push is not a
# release — the tag already shipped.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version being released (must match VERSION on main)"
        required: true
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Resolve the version being released
        id: resolve
        run: |
          set -euo pipefail
          file_version="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION file: $file_version"
          echo "version=$file_version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "requested:    ${{ inputs.version }}"
            test "$file_version" = "${{ inputs.version }}"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify --quiet HEAD^ >/dev/null; then
            echo "root commit — first release"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- VERSION; then
            echo "VERSION unchanged — not a release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  gate:
    needs: verify-version
    if: needs.verify-version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/ -x -q
      # The PR-time pii-check scans the diff, which cannot see PII committed
      # before its pattern existed. This scans the whole tracked tree.
      - name: No PII anywhere in the tracked tree
        env:
          PII_PATTERNS: ${{ secrets.PII_PATTERNS }}
        run: python3 tools/pii-scan.py

  publish:
    needs: [verify-version, gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.verify-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$version"
          git push origin "v$version"
          gh release create "v$version" --generate-notes --title "v$version"
